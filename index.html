<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Controller</title>
</head>
<body>
    <div class="container">
        <div class="test-field">
            <div class="test-dom-element">Тестовый DOM Элемент</div>
        </div>
        <div class="buttons-container">
            <button type="button" class="button">
                Прикрепить к DOM Элементу
            </button>
        </div>
    </div>
    
</body>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    body {
        background-color: #f3f0e9;
        padding: 5rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .container {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr max-content;
        gap: 1rem;
    }

    .test-field {
        border: 1px solid #ff3b30;
        border-radius: 4px;

        width: 100%;
        height: 100%;
    }

    .buttons-container {
        border: 1px solid #ff3b30;
        border-radius: 4px;

        width: 100%;
        height: 120px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem
    }

    .button {
        box-shadow: none;
        border: none;
        outline: none;

        width: fit-content;
        padding: 0.5rem 1rem;
        font-family: inherit;

        border-radius: 2px;
        background-color: #1a1a1a;
        color: #f3f0e9;

        transition: all 0.2s ease-in;
    }

    .button:hover {
        background-color: #1a1a1a22
    }
</style>
</html>
